<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a050d" />
      <stop offset="100%" stop-color="#040103" />
    </radialGradient>
    <linearGradient id="heartStroke" x1="12" y1="10" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd6a0" />
      <stop offset="45%" stop-color="#ff6b84" />
      <stop offset="100%" stop-color="#b8142c" />
    </linearGradient>
    <radialGradient id="petalOuter" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ff5c72" />
      <stop offset="65%" stop-color="#c91832" />
      <stop offset="100%" stop-color="#6e0716" />
    </radialGradient>
    <radialGradient id="petalInner" cx="48%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ff9eb0" />
      <stop offset="55%" stop-color="#e8263c" />
      <stop offset="100%" stop-color="#8a0b1d" />
    </radialGradient>
  </defs>

  <!-- Dark velvet circular emblem -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#d9b47a" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Luminous heart contour behind the rose -->
  <path
    d="M32 53C32 53 11 39.5 11 23.5C11 15.8 16.8 10.5 23.5 10.5C27.6 10.5 30.6 12.8 32 15.6C33.4 12.8 36.4 10.5 40.5 10.5C47.2 10.5 53 15.8 53 23.5C53 39.5 32 53 32 53Z"
    fill="#8b0018"
    fill-opacity="0.18"
    stroke="url(#heartStroke)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rose stem & golden leaves -->
  <path d="M32 39V51" stroke="#d9b47a" stroke-width="1.8" stroke-linecap="round" />
  <path d="M32 45C28 44.5 25.5 42 25 39.5C28 39.8 30.5 41.8 32 45Z" fill="#d9b47a" fill-opacity="0.85" />
  <path d="M32 43.5C36 43 38.5 40.5 39 38C36 38.3 33.5 40.3 32 43.5Z" fill="#d9b47a" fill-opacity="0.85" />

  <!-- Outer velvet rose petals -->
  <path
    d="M32 16C24.5 16 19 21.5 19.5 28.5C20 34.5 25.2 39 32 39C38.8 39 44 34.5 44.5 28.5C45 21.5 39.5 16 32 16Z"
    fill="url(#petalOuter)"
    stroke="#ffd6e0"
    stroke-opacity="0.35"
    stroke-width="0.8"
  />

  <!-- Inner spiraling rose crown -->
  <path
    d="M32 19.5C26.8 19.5 23 23.2 23.5 28C24 32.5 27.5 35.5 32 35.5C36.5 35.5 40 32.5 40.5 28C41 23.2 37.2 19.5 32 19.5Z"
    fill="url(#petalInner)"
  />
  <path
    d="M27 25.5C29 22.5 35 22.5 37 25.5C38.5 28 36 31.8 32 31.8C28 31.8 25.5 28 27 25.5Z"
    fill="#ff4d63"
    stroke="#ffe6eb"
    stroke-opacity="0.55"
    stroke-width="0.9"
  />
  <circle cx="32" cy="26.8" r="2.2" fill="#ffd6a0" />
</svg>
